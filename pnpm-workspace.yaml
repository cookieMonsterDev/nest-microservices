packages:
  - '.'

confirmModulesPurge: false

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  prisma: true
  unrs-resolver: true

fetchRetries: 5
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000
fetchTimeout: 120000

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@nestjs/*'
  - '@prisma/*'
  - prisma
  - '@swc/*'
  - typescript-eslint
  - '@typescript-eslint/*'
  - eslint
  - '@eslint/*'
  - jest
  - '@types/jest'
  - ts-jest
  - prettier
  - globals
  - pg
  - '@types/pg'
  - class-validator
  - dotenv
  - '@types/node'
  - '@types/express'
  - '@types/supertest'
  - '@swc/cli'
  - '@swc/core'
  - typescript
